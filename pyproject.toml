[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinstack"
version = "0.2.0"
description = "Supply-chain dependency pinning enforcement for every ecosystem"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "smthmlk" },
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
pinstack = "pinstack.cli:main"

[project.urls]
Homepage = "https://github.com/a4899e/pinstack"
Repository = "https://github.com/a4899e/pinstack"
"Bug Tracker" = "https://github.com/a4899e/pinstack/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinstack*"]

[tool.ruff.lint]
# Pin the rule selection explicitly. Ruff's implicit defaults change between
# minor releases (0.16 widened them from E4/E7/E9/F to a much larger set),
# which would otherwise turn a routine ruff bump into a breaking change.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
include = ["pinstack"]
exclude = ["tests", "build", "dist", ".venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Build tools (bandit, pyright, etc.) require Python >=3.10; the package
# itself still supports >=3.9 at runtime (dependencies = []).
environments = ["python_version >= '3.10'"]

[dependency-groups]
build = [
    "pytest==9.1.1",
    "pytest-randomly==4.1.0",
    "ruff==0.16.5",
    "pyright==1.1.411",
    "invoke==3.0.3",
    "jsonschema==4.26.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "detect-secrets==1.5.0",
    "setuptools==84.0.0",
]
